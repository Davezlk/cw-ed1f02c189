<script>
const __salt = Uint8Array.from(atob("ELVpBYRAnk7GMrUVQ8LSew=="), c => c.charCodeAt(0));
let __key;
async function __derive(pw) {
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: __salt, iterations: 200000, hash: "SHA-256"},
                                 k, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
}
async function __dec(buf) {
  const b = new Uint8Array(buf);
  return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: b.slice(0, 12)}, __key, b.slice(12)));
}
async function __gunzip(parts) {
  const s = new Blob(parts).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(s).text();
}
// The derived key (non-extractable CryptoKey) is kept in IndexedDB; the password itself is never stored.
function __idb(mode, fn) {
  return new Promise((res, rej) => {
    const o = indexedDB.open("cw-gate", 1);
    o.onupgradeneeded = () => o.result.createObjectStore("k");
    o.onerror = () => rej(o.error);
    o.onsuccess = () => {
      const tx = o.result.transaction("k", mode), r = fn(tx.objectStore("k"));
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    };
  });
}
const __kget = () => __idb("readonly", s => s.get("key")).catch(() => null);
const __kput = k => __idb("readwrite", s => s.put(k, "key")).catch(() => {});
const __kdel = () => __idb("readwrite", s => s.delete("key")).catch(() => {});
function __status(t) { const m = document.getElementById("main"); if (m) m.innerHTML = '<div class="empty">' + t + '</div>'; }
function __ask(wrong) {
  return new Promise(res => {
    const m = document.getElementById("main");
    m.innerHTML = '<form id="pwf" class="empty"><p>' +
      (wrong ? "Wrong password — try again." : "Enter the password to open the dashboard.") +
      '</p><input type="password" id="pw" aria-label="Password" autocomplete="current-password" style="padding:7px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:var(--panel);color:var(--ink);min-height:44px"> ' +
      '<button class="theme" type="submit" style="min-height:44px">Open</button></form>';
    const i = document.getElementById("pw"); i.focus();
    document.getElementById("pwf").onsubmit = e => { e.preventDefault(); res(i.value); };
  });
}
async function __get(path) {
  const r = await fetch(path + "?v=97e39786", {cache: "no-store"});
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.arrayBuffer();
}
async function __unlock(first) {
  const k = await __kget();
  if (k) { try { __key = k; return await __dec(first); } catch (e) { await __kdel(); } }
  // Older visits saved the password itself: use it once to derive the key, then delete it.
  let pw = null, tried = false;
  try { pw = localStorage.getItem("cwatch-pw"); localStorage.removeItem("cwatch-pw"); } catch (e) {}
  for (;;) {
    if (pw !== null) {
      try { __key = await __derive(pw); const t = await __dec(first); await __kput(__key); return t; }
      catch (e) { tried = true; }
    }
    pw = await __ask(tried);
    __status("Opening…");
  }
}
if (!window.DecompressionStream) __status("This browser is too old — update it, or open the link in Chrome or Safari.");
const __cache = {};
window.__boot = async () => { const f = "data/d00.bin"; __cache[f] = await __unlock(await __get(f)); };
window.__fetchText = async f => { const p = __cache[f] || await __dec(await __get(f)); delete __cache[f]; return __gunzip([p]); };
window.__fetchThumbs = async f => JSON.parse(await __gunzip([await __dec(await __get("thumbs/" + f))]));
</script>
<title>Dashboard</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15191f; --ink2:#454e5a; --ink3:#5a6370; --line:#e2e5ea;
  --accent:#1f5fbf; --accent-bg:#e8f0fc; --good:#1a7345; --good-bg:#e3f4ea; --hot:#b3261e; --hot-bg:#fbe9e7;
  --warm:#8a5100; --warm-bg:#fdf1dc; --chip:#eef0f3; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1216; --panel:#171b21; --ink:#e8ebef; --ink2:#b3bac4; --ink3:#9ca5b1; --line:#2a3039;
  --accent:#7fb0ff; --accent-bg:#1a2a44; --good:#6fd39b; --good-bg:#15301f; --hot:#ff8a80; --hot-bg:#3a1a18;
  --warm:#f0b95a; --warm-bg:#352812; --chip:#232932; --shadow:none; }}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --ink:#e8ebef; --ink2:#b3bac4; --ink3:#9ca5b1; --line:#2a3039;
  --accent:#7fb0ff; --accent-bg:#1a2a44; --good:#6fd39b; --good-bg:#15301f; --hot:#ff8a80; --hot-bg:#3a1a18;
  --warm:#f0b95a; --warm-bg:#352812; --chip:#232932; --shadow:none; }
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 24px 0;max-width:1500px;margin:0 auto;position:relative}
h1{font-size:20px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em;padding-right:190px}
.sub{color:var(--ink3);font-size:12.5px}
.banner{background:var(--hot-bg);color:var(--hot);border:1px solid var(--hot);border-radius:8px;padding:8px 12px;margin:10px 0 0;font-weight:600}
.banner .muted{font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:650}
.kpi b.warn{font-size:14px;color:var(--hot);line-height:1.6}
.kpi span{color:var(--ink3);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;color:var(--ink2);font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
nav button .n{color:var(--ink3);font-size:12px;margin-left:4px}
main{max-width:1500px;margin:0 auto;padding:14px 24px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.bar .fx{display:contents}
.bar input,.bar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;max-width:100%}
.bar input[type=search]{min-width:260px;flex:1}
.bar label{color:var(--ink2);font-size:13px;display:flex;gap:5px;align-items:center}
.fbtn{display:none}
.filt{display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);color:var(--accent);border:0;border-radius:6px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:break-word}
th{font-size:12px;color:var(--ink3);font-weight:600;background:var(--panel);position:sticky;top:0;user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
tr.camp{cursor:pointer}
tr.camp:hover td{background:var(--accent-bg)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-block;background:var(--chip);border-radius:5px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12px;white-space:normal;overflow-wrap:anywhere}
.chip.disc{font-style:italic}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:600}
.tag.gap{background:var(--warm-bg);color:var(--warm)}
.tag.ovl{background:var(--good-bg);color:var(--good)}
.tag.new{background:var(--hot-bg);color:var(--hot)}
.tag.off{background:var(--chip);color:var(--ink3)}
.muted{color:var(--ink3)}
.what{color:var(--ink2);font-size:12.5px;font-weight:400;margin-top:3px;max-width:520px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.card .img{aspect-ratio:1.6;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:10px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .who{font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:6px}
.card .hl{font-weight:600}
.rainl{background:var(--warm-bg);color:var(--warm);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600}
.rainl .muted{font-weight:400;color:var(--ink2)}
.card .tx{color:var(--ink2);font-size:13px;white-space:pre-wrap;max-height:9.5em;overflow:hidden}
.card .ft{font-size:12px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line);align-items:center}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button.lnk{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer}
button.lnk:hover{text-decoration:underline}
.expand td{background:var(--bg)}
.expand .grid{padding:8px 0}
.empty{padding:40px;text-align:center;color:var(--ink3)}
.topbtns{position:absolute;top:18px;right:24px;display:flex;gap:6px}
.theme{background:var(--panel);border:1px solid var(--line);color:var(--ink2);border-radius:7px;padding:5px 9px;cursor:pointer;font:inherit}
.more{display:block;margin:14px auto;background:var(--panel);border:1px solid var(--line);color:var(--accent);border-radius:8px;padding:8px 18px;font:inherit;cursor:pointer}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.grp h3{margin:0 0 4px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp .grid{margin-top:10px}
.note{background:var(--warm-bg);color:var(--warm);border-radius:8px;padding:8px 12px;margin-bottom:12px}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12px}
@media (max-width:700px){
  header,main{padding-left:16px;padding-right:16px}
  .topbtns{top:12px;right:16px}
  h1{font-size:18px;padding-right:130px}
  .hide-sm{display:none!important}
  .kpis{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:10px 0}
  .kpi{flex:0 0 auto;padding:6px 10px;min-height:44px;display:flex;align-items:baseline;gap:5px}
  .kpi b{display:inline;font-size:15px}
  .kpi b.warn{font-size:12px}
  .kpi span{font-size:11.5px;white-space:nowrap}
  nav button,.theme,.more,.fbtn,.bar select,.bar input,.filt{min-height:44px}
  .theme{min-width:44px}
  .bar label{min-height:44px}
  .bar input[type=search]{min-width:0;flex:1 1 100%}
  .fbtn{display:inline-flex;align-items:center;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:0 14px;font:inherit;cursor:pointer}
  .bar .fx{display:none;width:100%;flex-wrap:wrap;gap:8px}
  .bar .fx.open{display:flex}
  .bar .fx select{flex:1 1 100%}
  .card .ft a,.card .ft button.lnk{min-height:44px;display:inline-flex;align-items:center}
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t thead{display:none}
  table.t{border:0;background:none;overflow:visible}
  table.t tr{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 0}
  table.t tr.expand{background:none;border:0;padding:0}
  table.t td{border:0;padding:4px 12px;overflow-wrap:anywhere}
  table.t td.num{text-align:left}
  table.t td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--ink3)}
  table.t td a{display:inline-flex;align-items:center;min-height:44px}
}
</style>
</head>
<body>
<div class="topbtns">
  <button class="theme" id="refresh" type="button" aria-label="Reload the latest data">↻<span class="hide-sm"> Refresh</span></button>
  <button class="theme" id="theme" type="button" aria-label="Toggle light / dark theme">◐</button>
</div>
<header>
  <h1 id="h1">Dashboard</h1>
  <div class="sub" id="sub"></div>
  <div id="banner"></div>
  <div class="kpis" id="kpis"></div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
const EMBED = /*__DATA__*/null;
const MANIFEST = {"core": ["d00.bin", "d01.bin", "d02.bin", "d03.bin", "d04.bin", "d05.bin", "d06.bin", "d07.bin", "d08.bin"], "more": ["m00.bin"]};
const $ = s => document.querySelector(s);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// Links only ever go to http(s) pages; anything else (javascript:, data:, …) becomes "#".
const safeUrl = u => { try { const x = new URL(String(u || ""), "https://x.invalid/"); return /^https?:$/.test(x.protocol) && u ? x.href : "#"; } catch (e) { return "#"; } };
const ext = (u, label, attrs = "") => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener noreferrer"${attrs}>${label}</a>`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
try { const t = store.get("cwatch-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nx = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nx;
  store.set("cwatch-theme", nx);
};
$("#refresh").onclick = () => { $("#refresh").textContent = "↻ …"; location.reload(); };

function status(t) { const m = $("#main"); if (m) m.innerHTML = '<div class="empty">' + esc(t) + "</div>"; }
// The password site swaps these for decrypting versions (window.__fetchText / __fetchThumbs).
const fetchText = f => window.__fetchText ? window.__fetchText(f)
  : fetch(f).then(r => { if (!r.ok) throw new Error(f + " " + r.status); return r.text(); });
const fetchThumbs = f => window.__fetchThumbs ? window.__fetchThumbs(f)
  : fetch("thumbs/" + f).then(r => { if (!r.ok) throw new Error(f + " " + r.status); return r.json(); });
async function fetchAll(files, label, show = true) {
  let k = 0;
  if (show) status(`${label} 0/${files.length}…`);
  const parts = await Promise.all(files.map(f => fetchText("data/" + f).then(t => { k++; if (show) status(`${label} ${k}/${files.length}…`); return t; })));
  return parts.join("");
}

(async () => {
  if (window.__boot) await window.__boot();
  const D = EMBED || JSON.parse(await fetchAll(MANIFEST.core, "Loading"));
  start(D);
})().catch(e => status("Couldn't load the dashboard data (" + (e && e.message) + "). Try Refresh."));

function start(D) {
const L = Object.assign({title: "Dashboard", us: "Us", rain: "Investigations", rain_src: "investigation feed", ours_tab: "Our ads", rain_tab: "Investigations", bot: "", track_to: ""}, D.cfg || {});
document.title = L.title; $("#h1").textContent = L.title;
const QUIET = "0000-00-00 00:00";
let byKey, campByKey = {}, comp, live;
function index() {
  D.ads.forEach(a => { // fields the data leaves out when they can be rebuilt
    if (!a.who) a.who = a.firm || (a.advertiser || "?") + "*";
    if (!a.library_url && a.platform === "meta") a.library_url = "https://www.facebook.com/ads/library/?id=" + a.ad_key.split(":").pop();
  });
  byKey = Object.fromEntries(D.ads.map(a => [a.ad_key, a]));
  campByKey = Object.fromEntries(D.campaigns.map(c => [c.key, c]));
  comp = D.ads.filter(a => !a.us);
  live = comp.filter(a => a.active);
}
index();
const campBy = Object.fromEntries(D.campaigns.map(c => [c.key, c]));
const THUMBS = {};
const rainBy = {};
(D.rain || []).forEach(r => (r.tkeys || []).forEach(k => (rainBy[k] = rainBy[k] || []).push(r)));
const rainFor = a => (a.tkey && rainBy[a.tkey]) || [];
const isBreach = t => /data breach/i.test(t || "");

// ---- older / stopped ads: separate files, fetched only when someone asks for them ----
let moreState = (MANIFEST && MANIFEST.more && MANIFEST.more.length) ? "no" : "done";
async function ensureMore() {
  if (moreState !== "no") return;
  moreState = "loading"; renderBody();
  try {
    const xs = JSON.parse(await fetchAll(MANIFEST.more, "Loading older ads", false));
    D.ads.push(...xs); index(); moreState = "done";
  } catch (e) { moreState = "no"; }
  render();
}
const needMore = () => !state.liveOnly || state.adv;

// ---- state, deep links ----
const PAGE = 50, CAMP_ADS = 24;
let state = {tab: "ads", q: "", firm: "", adv: "", advName: "", plat: "", theory: "", liveOnly: true, gapOnly: false,
  rainOnly: false, rainNobody: false, noBreach: false, sort: null, open: null, limit: PAGE, openLimit: CAMP_ADS,
  since: "sweep", fopen: false};
try { const s = JSON.parse(store.get("cwatch2") || "{}"); ["tab", "liveOnly", "noBreach", "since"].forEach(k => { if (k in s) state[k] = s[k]; }); } catch (e) {}
const save = () => store.set("cwatch2", JSON.stringify({tab: state.tab, liveOnly: state.liveOnly, noBreach: state.noBreach, since: state.since}));
// First load of the day opens on what's new.
const today = new Date().toDateString();
if (store.get("cwatch-day") !== today) { state.tab = "new"; store.set("cwatch-day", today); }
// "since my last visit" = the visit before this one.
const prevVisit = store.get("cwatch-visit");
const pad = n => String(n).padStart(2, "0");
const stamp = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
store.set("cwatch-visit", stamp(new Date()));
function readHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (![...h.keys()].length) return;
  const t = h.get("tab");
  if (t && TABS.some(x => x[0] === t)) state.tab = t;
  if (h.has("q")) state.q = h.get("q");
  if (h.get("campaign")) { state.tab = "campaigns"; state.open = h.get("campaign"); }
  if (h.get("adv")) { state.tab = "ads"; state.adv = h.get("adv"); state.advName = h.get("name") || h.get("adv"); state.liveOnly = false; }
}
function writeHash() {
  const h = new URLSearchParams();
  h.set("tab", state.tab);
  if (state.q) h.set("q", state.q);
  if (state.open && state.tab === "campaigns") h.set("campaign", state.open);
  if (state.adv) { h.set("adv", state.adv); h.set("name", state.advName); }
  try { history.replaceState(null, "", "#" + h.toString()); } catch (e) {}
}
const linkTo = params => location.href.split("#")[0] + "#" + new URLSearchParams(params).toString();

// ---- health: when was the data last good ----
const H = D.health || {};
const lastRun = D.runs[D.runs.length - 1];
const failed = !!H.last_run_failed;
const fmtWhen = s => { const d = new Date((s || "").replace(" ", "T")); return isNaN(d) ? (s || "never") : d.toLocaleString([], {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}); };
const fmtShort = s => { const d = new Date((s || "").replace(" ", "T")); return isNaN(d) ? (s || "never") : d.toLocaleString([], {weekday: "short", hour: "numeric"}); };
$("#sub").textContent = `Data as of: Meta ${fmtWhen(H.last_good_meta || (lastRun && lastRun.started))} · Google ${fmtWhen(H.last_good_google)}`
  + (H.google_total ? ` · Google: ${H.google_swept_today || 0}/${H.google_total} swept today` : "")
  + ` · last sweep attempt ${fmtWhen(lastRun && lastRun.started)}` + (D.baseline ? " · first sweep = baseline" : "");
if (false && failed) {  // red banner removed (David 2026-10-19); the header's "Data as of" times stay
  const n = H.failed_streak || 1, by = H.blocked_by ? `blocked by ${H.blocked_by}` : "failed";
  $("#banner").innerHTML = `<div class="banner" role="alert">${n > 1 ? `Last ${n} sweeps ${by}` : `Last sweep ${by}`} — data from ${esc(fmtShort(H.last_good_meta))}`
    + `<div class="muted">Counts below are from the last good collection; “new” can't be checked until a sweep gets through.</div></div>`;
}

// ---- New: since when ----
const SINCE = [["sweep", "since last sweep"], ["24h", "last 24 hours"], ["7d", "last 7 days"], ["visit", "since my last visit"]];
function sinceTime() {
  const now = Date.now();
  if (state.since === "24h") return stamp(new Date(now - 864e5));

        nw: fa.filter(a => a.new).length, targets: Object.entries(tg).sort((a, b) => b[1] - a[1]).slice(0, 10)};
    }).filter(r => hasWords([r.f.name, r.f.group, ...r.targets.map(t => t[0])])).sort((a, b) => b.live - a.live);
    const cols = [
      {l: "Firm", s: r => r.f.name.toLowerCase(), h: r => `<a href="#" data-firm="${esc(r.f.name)}"><b>${esc(r.f.name)}</b></a>`},
      {l: "Group", cls: "hide-sm muted", s: r => r.f.group || "", h: r => esc(r.f.group || "")},
      {l: "Live", cls: "num", s: r => -r.live, h: r => r.live},
      {l: "Meta", cls: "num", s: r => -r.meta, h: r => r.meta},
      {l: "Google", cls: "num", s: r => -r.google, h: r => r.google},
      {l: "New", cls: "num", s: r => -r.nw, h: r => failed ? '<span class="muted">?</span>' : (r.nw || "")},
      {l: "Top live targets", s: r => (r.targets[0] || [""])[0], h: r => r.targets.map(([t, n]) => `<span class="chip">${esc(t)} · ${n}</span>`).join("")},
      {l: "Sources", cls: "hide-sm muted", h: r => `<span style="font-size:12px">${r.f.meta.map(p => ext(fbUrl(p), "FB " + esc(p))).join(" ")} ${r.f.google.map(g => ext("https://adstransparency.google.com/advertiser/" + encodeURIComponent(g) + "?region=US", "G")).join(" ")}${!r.f.meta.length && !r.f.google.length ? "no ids — domain search only" : ""}</span>`},
    ];
    return table("firms", cols, rows);
  },
  rain() {
    if (!(D.rain || []).length) return `<div class="empty">The ${esc(L.rain_src)} feed wasn't found on this machine.</div>`;
    const rs = (D.rain || []).filter(r => hasWords([r.company, r.domain, r.title, ...(r.investigating_firms || []), ...(r.advertisers || [])]))
      .filter(r => !state.rainNobody || !r.live_ads)
      .filter(r => !state.noBreach || !(isBreach(r.title) || isBreach(r.company) || isBreach(r.claim) || isBreach(r.theory)));
    const cols = [
      {l: "Company", s: r => (r.company || "").toLowerCase(), h: r => `<b>${esc(r.company)}</b>${r.domain ? `<div class="muted" style="font-size:12px">${esc(r.domain)}</div>` : ""}<div class="muted" style="font-size:12px">${esc(r.title || "")}</div>`},
      {l: `Investigating (${L.rain})`, h: r => chips((r.investigating_firms || []).map(f => f.trim()))},
      {l: `${L.rain} date`, cls: "hide-sm muted", s: r => r.rain_date || "", h: r => esc(r.rain_date)},
      {l: "Live ads", cls: "num", s: r => -(r.live_ads || 0), h: r => r.live_ads || ""},
      {l: "Who's advertising", h: r => chips(r.advertisers || []) || '<span class="muted">nobody yet</span>'},
      {l: L.us, h: r => r.lk_advertising ? '<span class="tag ovl">running</span>' : (r.live_ads ? '<span class="tag gap">GAP</span>' : "")},
    ];
    return `<p class="muted">${esc(L.rain_src)} investigations matched against live ads. ${rs.filter(r => r.live_ads).length} of ${rs.length} have someone advertising.</p>` + table("rain", cols, rs);
  },
  angles() {
    // New angles (David, 2026-10-20): competitor campaigns in theories we don't advertise in,
    // triaged for further thought. Not legal advice and not a recommendation — a reading list.
    const A = D.angles || {rows: []};
    const TIERS = [["look", "Worth a look", `Several firms, a ${L.rain} investigation, or a fresh push — the strongest signals that it's a real, active angle.`],
      ["watch", "Watch", "One firm, older or small. Worth knowing about; not urgent."],
      ["off", "Probably not for us", "Personal-injury, medical, benefits or claims-admin models — listed for completeness."]];
    const pick = state.angleTier || "look";
    const rows = A.rows.filter(r => campByKey[r.key]).filter(r => r.tier === pick)
      .filter(r => { const c = campByKey[r.key]; return !(state.noBreach && isBreach(c.theory)) && hasWords([c.target, c.theory, c.claim_type, c.what, ...c.firms, ...r.why]); });
    const cols = [
      {l: "Target", s: r => campByKey[r.key].target.toLowerCase(), h: r => { const c = campByKey[r.key]; return `<b>${esc(c.target)}</b>${c.what ? `<div class="what">${esc(c.what)}</div>` : ""}<div><button type="button" class="lnk" data-fwdc="${esc(c.key)}">Forward ↗</button></div>`; }},
      {l: "Theory", s: r => campByKey[r.key].theory || "", h: r => esc(campByKey[r.key].theory || "")},
      {l: "Vehicle", cls: "hide-sm", s: r => campByKey[r.key].claim_type || "", h: r => esc(campByKey[r.key].claim_type || "")},
      {l: "Why it's here", s: r => -r.score, h: r => r.why.map(w => `<div style="font-size:12.5px">• ${esc(w)}</div>`).join("")},
      {l: "Who's running it", h: r => chips(campByKey[r.key].firms.map(f => f.replace(/\*$/, "")))},
      {l: "Ads", cls: "num", s: r => -campByKey[r.key].n_ads, h: r => campByKey[r.key].n_ads},
      {l: "Since", cls: "hide-sm muted", s: r => campByKey[r.key].first_start || "", h: r => esc(campByKey[r.key].first_start || "")},
    ];
    const counts = Object.fromEntries(TIERS.map(([k]) => [k, A.rows.filter(r => r.tier === k && campByKey[r.key]).length]));
    const t = TIERS.find(x => x[0] === pick);
    return `<p class="muted">Live competitor campaigns in areas we don't advertise in. “What we do” = theories with at least 3 live ${esc(L.us)} ads: ${esc((A.our_theories || []).join(", "))}. Triage is automatic, from ad signals only — a list to think about, not a recommendation.</p>
      <div class="bar">${TIERS.map(([k, l]) => `<button type="button" class="kpi" style="padding:6px 12px" data-atier="${k}" aria-pressed="${pick === k}"><b style="display:inline;font-size:15px">${counts[k]}</b> <span>${esc(l)}</span></button>`).join("")}</div>
      <p class="muted">${esc(t[2])}</p>
      <p class="muted" style="font-size:12.5px">By area: ${(A.by_theory || []).map(([th, n]) => `${esc(th)} ${n}`).join(" · ")}</p>` +
      (rows.length ? table("angles", cols, rows, {
        rowAttr: r => ` class="camp" data-k="${esc(r.key)}" tabindex="0" role="button" aria-expanded="${state.open === r.key}"`,
        after: r => state.open === r.key ? `<tr class="expand"><td colspan="7">${grid(campByKey[r.key].ads.slice(0, state.openLimit).map(k => byKey[k]))}${moreBtn(Math.min(state.openLimit, campByKey[r.key].ads.length), campByKey[r.key].ads.length, "open")}</td></tr>` : "",
      }) : `<div class="empty">Nothing in this group matches.</div>`) + `<p class="muted">Tap a row to see its ads.</p>`;
  },
  discovered() {
    const xs = D.discovered.filter(d => (!state.liveOnly || d.live) && !(state.noBreach && d.breach) && hasWords([d.name, d.sample, ...d.targets]));
    const cols = [
      {l: "Advertiser", s: d => d.name.toLowerCase(), h: d => `<a href="#" data-adv="${esc(d.page_id)}" data-name="${esc(d.name)}"><b>${esc(d.name)}</b></a>
        <div style="font-size:12px;margin-top:3px">${ext(fbUrl(d.page_id), "Facebook ↗")}${trackUrl(d.name, d.page_id) ? " · " + ext(trackUrl(d.name, d.page_id), "<b>+ Track</b>") : ""}</div>`},
      {l: "Live (caught)", cls: "num", s: d => -d.live, h: d => d.live},
      {l: "Seen (caught)", cls: "num", s: d => -d.n, h: d => d.n},
      {l: "Targets", h: d => chips(d.targets)},
      {l: "Sample headline", cls: "hide-sm muted", h: d => esc(d.sample || "")},
    ];
    return `<p class="muted">Pages running legal-recruitment ads found by the keyword sweeps that aren't on the tracked list. Tap a name to see every ad we've collected for it. Counts are the ads our keyword searches have caught, not everything they run${L.track_to ? " — tap <b>+ Track</b> to pull all of an advertiser's ads from the next sweep on" : ""}.</p>` + table("discovered", cols, xs);
  },
};

// ---- thumbnails: fetch a chunk only when one of its cards scrolls into view ----
const tcState = {};
async function loadChunk(i) {
  const f = (D.thumb_chunks || [])[i];
  if (!f || tcState[i]) return;
  tcState[i] = "loading";
  try { Object.assign(THUMBS, await fetchThumbs(f)); tcState[i] = "done"; fillThumbs(); }
  catch (e) { tcState[i] = "failed"; }
}
function fillThumbs() {
  document.querySelectorAll("img[data-ti]:not([src])").forEach(im => { const u = THUMBS[im.dataset.ti]; if (u) im.src = u; });
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { io.unobserve(e.target); loadChunk(+e.target.dataset.tc); }
}), {rootMargin: "600px"}) : null;
function watchThumbs(root) {
  root.querySelectorAll("img[data-ti]:not([src])").forEach(im => io ? io.observe(im) : loadChunk(+im.dataset.tc));
  root.querySelectorAll("img[data-fb]").forEach(im => im.onerror = () => { im.onerror = null; const u = im.dataset.fb; if (u && u !== "#") im.src = u; else im.style.display = "none"; });
}

function renderBody() {
  const el = $("#body");
  if (!el) return;
  el.innerHTML = BODIES[state.tab]();
  const toggle = tr => { state.open = state.open === tr.dataset.k ? null : tr.dataset.k; state.openLimit = CAMP_ADS; renderBody(); writeHash(); };
  el.querySelectorAll("tr.camp").forEach(tr => {
    tr.onclick = e => { if (!e.target.closest("button,a")) toggle(tr); };
    tr.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === tr) { e.preventDefault(); toggle(tr); } };
  });
  el.querySelectorAll("th[data-sort]").forEach(th => {
    const go = () => {
      const i = +th.dataset.sort, s = state.sort;
      state.sort = {id: th.dataset.tid, i, dir: s && s.id === th.dataset.tid && s.i === i ? -s.dir : 1};
      renderBody();
    };
    th.onclick = go;
    th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
  el.querySelectorAll("a[data-firm]").forEach(a => a.onclick = e => { e.preventDefault(); Object.assign(state, {firm: a.dataset.firm, adv: "", advName: "", tab: "ads", liveOnly: false, q: "", limit: PAGE}); ensureMore(); render(); $("#tabs").scrollIntoView({behavior: "smooth", block: "start"}); });
  el.querySelectorAll("a[data-adv]").forEach(a => a.onclick = e => { e.preventDefault(); showAdvertiser(a.dataset.adv, a.dataset.name); ensureMore(); });
  el.querySelectorAll("[data-atier]").forEach(b => b.onclick = () => { Object.assign(state, {angleTier: b.dataset.atier, open: null, limit: PAGE}); renderBody(); });
  el.querySelectorAll("[data-clearadv]").forEach(a => a.onclick = () => { Object.assign(state, {adv: "", advName: "", liveOnly: true, limit: PAGE}); render(); });
  el.querySelectorAll("[data-fwd]").forEach(b => b.onclick = e => { e.stopPropagation(); forwardAd(b.dataset.fwd); });
  el.querySelectorAll("[data-fwdc]").forEach(b => b.onclick = e => { e.stopPropagation(); forwardCamp(b.dataset.fwdc); });
  el.querySelectorAll("[data-more]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    if (b.dataset.more === "open") state.openLimit += CAMP_ADS; else state.limit += PAGE;
    renderBody();
  });
  el.querySelectorAll("[data-opengrp]").forEach(b => b.onclick = () => {
    const k = "new:" + b.dataset.opengrp;
    if (state.open === k) state.openLimit += CAMP_ADS; else { state.open = k; state.openLimit = CAMP_ADS; }
    renderBody();
  });
  watchThumbs(el);
}
function render() {
  renderTabs();
  renderKpis();
  const barOpts = {campaigns: {gap: true, live: false}, new: {live: false, since: true}, ads: {rain: true}, ours: {firm: false},
    firms: {simple: " "}, angles: {simple: " "},
    rain: {simple: `<label><input type="checkbox" id="nobody" ${state.rainNobody ? "checked" : ""}> only ones nobody is advertising yet</label>`},
    discovered: {simple: `<label><input type="checkbox" id="live" ${state.liveOnly ? "checked" : ""}> live only</label>`}}[state.tab];
  const chip = state.q ? `<p><button type="button" class="filt" id="clearq" aria-label="Clear search">Filtered: ${esc(state.q)} ✕</button></p>` : "";
  $("#main").innerHTML = filterBar(barOpts) + chip + `<div id="body" role="tabpanel" aria-labelledby="tab-${state.tab}"></div>`;
  wireBar();
  const cq = $("#clearq"); if (cq) cq.onclick = () => { state.q = ""; render(); };
  renderBody();
  writeHash();
}
readHash();
if (needMore()) ensureMore();
render();
window.addEventListener("hashchange", () => { readHash(); if (needMore()) ensureMore(); render(); });
}
</script>
</body>
